<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <rect fill="#fff" width="900" height="600"/>
  <g transform="translate(450,300)">
    <!-- Taegeuk (yin-yang) -->
    <circle r="150" fill="#cd2e3a"/>
    <path d="M0-150A150 150 0 0 1 0 150A75 75 0 0 1 0 0A75 75 0 0 0 0-150" fill="#0047a0"/>
    <!-- Trigrams -->
    <g fill="none" stroke="#000" stroke-width="24" stroke-linecap="butt">
      <!-- Geon (top-left: heaven ☰) -->
      <g transform="rotate(56.31)">
        <line x1="-205" y1="-108" x2="-120" y2="-108"/>
        <line x1="-205" y1="-150" x2="-120" y2="-150"/>
        <line x1="-205" y1="-192" x2="-120" y2="-192"/>
      </g>
      <!-- Gon (bottom-right: earth ☷) -->
      <g transform="rotate(56.31) translate(0,0) scale(-1,-1)">
        <line x1="-205" y1="-108" x2="-168" y2="-108"/>
        <line x1="-157" y1="-108" x2="-120" y2="-108"/>
        <line x1="-205" y1="-150" x2="-168" y2="-150"/>
        <line x1="-157" y1="-150" x2="-120" y2="-150"/>
        <line x1="-205" y1="-192" x2="-168" y2="-192"/>
        <line x1="-157" y1="-192" x2="-120" y2="-192"/>
      </g>
      <!-- Gam (top-right: water ☵) -->
      <g transform="rotate(-56.31) scale(-1,1)">
        <line x1="-205" y1="-108" x2="-168" y2="-108"/>
        <line x1="-157" y1="-108" x2="-120" y2="-108"/>
        <line x1="-205" y1="-150" x2="-120" y2="-150"/>
        <line x1="-205" y1="-192" x2="-168" y2="-192"/>
        <line x1="-157" y1="-192" x2="-120" y2="-192"/>
      </g>
      <!-- Ri (bottom-left: fire ☲) -->
      <g transform="rotate(-56.31)">
        <line x1="-205" y1="-108" x2="-120" y2="-108"/>
        <line x1="-205" y1="-150" x2="-168" y2="-150"/>
        <line x1="-157" y1="-150" x2="-120" y2="-150"/>
        <line x1="-205" y1="-192" x2="-120" y2="-192"/>
      </g>
    </g>
  </g>
</svg>
