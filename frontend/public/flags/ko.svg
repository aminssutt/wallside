<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <rect width="900" height="600" fill="#fff"/>

  <!-- Taegeuk: yin-yang tilted so the boundary runs along the Gam↔Ri diagonal -->
  <g transform="translate(450 300) rotate(-33.69)">
    <circle r="150" fill="#c60c30"/>
    <path d="M 0 -150 A 150 150 0 0 1 0 150 A 75 75 0 0 1 0 0 A 75 75 0 0 0 0 -150 Z" fill="#003478"/>
  </g>

  <!-- Trigrams, black bars; each group is translated to its corner and rotated to aim at the Taegeuk -->
  <g fill="#000">
    <!-- Geon ☰ (upper hoist / top-left): three solid bars -->
    <g transform="translate(162.1 108.1) rotate(-56.31)">
      <rect x="-60" y="-37.5" width="120" height="15"/>
      <rect x="-60" y="-7.5" width="120" height="15"/>
      <rect x="-60" y="22.5" width="120" height="15"/>
    </g>

    <!-- Ri ☲ (lower hoist / bottom-left): solid, broken, solid -->
    <g transform="translate(162.1 491.9) rotate(-123.69)">
      <rect x="-60" y="-37.5" width="120" height="15"/>
      <rect x="-60" y="-7.5" width="47.5" height="15"/>
      <rect x="12.5" y="-7.5" width="47.5" height="15"/>
      <rect x="-60" y="22.5" width="120" height="15"/>
    </g>

    <!-- Gam ☵ (upper fly / top-right): broken, solid, broken -->
    <g transform="translate(737.9 108.1) rotate(-33.69)">
      <rect x="-60" y="-37.5" width="47.5" height="15"/>
      <rect x="12.5" y="-37.5" width="47.5" height="15"/>
      <rect x="-60" y="-7.5" width="120" height="15"/>
      <rect x="-60" y="22.5" width="47.5" height="15"/>
      <rect x="12.5" y="22.5" width="47.5" height="15"/>
    </g>

    <!-- Gon ☷ (lower fly / bottom-right): three broken bars -->
    <g transform="translate(737.9 491.9) rotate(33.69)">
      <rect x="-60" y="-37.5" width="47.5" height="15"/>
      <rect x="12.5" y="-37.5" width="47.5" height="15"/>
      <rect x="-60" y="-7.5" width="47.5" height="15"/>
      <rect x="12.5" y="-7.5" width="47.5" height="15"/>
      <rect x="-60" y="22.5" width="47.5" height="15"/>
      <rect x="12.5" y="22.5" width="47.5" height="15"/>
    </g>
  </g>
</svg>
