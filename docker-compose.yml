networks:
  dokploy-network:
    external: true
  internal:
    driver: bridge

services:
  app:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    expose:
      - "3000"
    networks:
      dokploy-network:
        aliases:
          - carchat-backend
      internal:
        aliases:
          - carchat-backend
    environment:
      - PORT=3000
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LLM_PLANNER_MODEL=${LLM_PLANNER_MODEL:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://carchat.online,https://www.carchat.online}
      # Legacy RAG pipeline is the canonical prod path (stable, 4-5s TTFT).
      # Agent path is kept for experimentation but needs workers>=2 to be
      # reliable — with workers=1 (default) the nested ThreadPoolExecutors
      # saturate the worker under load. Set AGENT_ENABLED=1 only when the
      # agent architecture has been hardened.
      - AGENT_ENABLED=${AGENT_ENABLED:-0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
