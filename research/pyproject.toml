[project]
name = "ragscale"
version = "0.1.0"
description = "Research harness: how accurately does an LLM retrieval pipeline find the right document as the corpus grows?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "scipy>=1.13",
    "faiss-cpu>=1.8",
    "bm25s>=0.2.10",
    "PyStemmer>=2.2",
    # Needed only to unpickle the production indexes (Document + BM25Okapi objects).
    "rank-bm25>=0.2.2",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "ranx>=0.3.20",
]

[project.optional-dependencies]
# Local neural models (embeddings, cross-encoder rerankers). Heavy: install natively on the Mac to use MPS.
local = [
    "torch>=2.4",
    "sentence-transformers>=3.3",
    "transformers>=4.46",
]
dev = ["pytest>=8"]

[project.scripts]
ragscale = "ragscale.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragscale"]

[tool.pytest.ini_options]
testpaths = ["tests"]
